<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Practice Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background-color: #f0f2f5;
    }
    h1 {
      color: #333;
    }
    section {
      background-color: #fff;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    button {
      padding: 8px 16px;
      margin-top: 10px;
      cursor: pointer;
    }
    #output {
      margin-top: 15px;
      font-weight: bold;
      color: #007BFF;
    }
  </style>
</head>
<body>

  <h1>JavaScript Practice Page</h1>

  <section>
    <h2>Random Function Test</h2>
    <button id="testBtn">Run Test Function</button>
    <div id="output"></div>
  </section>

  <section>
    <h2>Another Example</h2>
    <input type="text" id="userInput" placeholder="Type something">
    <button id="inputBtn">Submit</button>
    <div id="inputOutput"></div>
  </section>
  
  <section>
  <h2>Add Two Numbers</h2>
  <input type="number" id="num1" placeholder="Enter first number">
  <input type="number" id="num2" placeholder="Enter second number">
  <button id="addBtn">Add Numbers</button>
  <div id="addOutput"></div>
</section>

  <!-- Link to external JS -->
  <script src="functions.js"></script>
</body>
</html>
