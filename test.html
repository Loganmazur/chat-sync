<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Platform Stream Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background-color: #1a1a1d;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-bottom: 25px;
            color: #ffffff;
            text-align: center;
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .main-content {
            display: flex;
            gap: 20px;
        }

        .video-section {
            flex: 1;
            min-width: 0;
        }

        .chat-section {
            width: 400px;
            flex-shrink: 0;
        }

        .section-card {
            background-color: #2a2a2e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .section-title {
            margin-bottom: 15px;
            color: #e0e0e0;
            font-size: 1.3em;
            font-weight: 600;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }

        iframe {
            border: none;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .controls {
            margin-top: 15px;
            padding: 15px;
            background-color: #3a3a3e;
            border-radius: 6px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #b0b0b0;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #4a4a4e;
            border-radius: 5px;
            background-color: #2a2a2e;
            color: #e0e0e0;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        input::placeholder {
            color: #6a6a6e;
        }

        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 80px;
            padding: 10px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: linear-gradient(135deg, #4a4a4e 0%, #3a3a3e 100%);
        }

        /* Chat Container */
        .chat-container {
            background-color: #18181b;
            border-radius: 8px;
            padding: 12px;
            height: 550px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar {
            width: 8px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: #2a2a2e;
            border-radius: 4px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }

        .chat-container::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        .chat-message {
            padding: 8px 10px;
            margin-bottom: 6px;
            border-radius: 4px;
            background-color: rgba(42, 42, 46, 0.5);
            line-height: 1.5;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .message-badge {
            display: inline-block;
            padding: 3px 7px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: bold;
            margin-right: 8px;
            text-transform: uppercase;
        }

        .badge-twitch {
            background-color: #9146ff;
            color: white;
        }

        .badge-kick {
            background-color: #53fc18;
            color: #000;
        }

        .message-author {
            color: #00d9ff;
            font-weight: 600;
            margin-right: 6px;
        }

        .message-content {
            color: #efeff1;
        }

        .status-bar {
            margin-top: 15px;
            padding: 12px;
            background-color: #3a3a3e;
            border-radius: 6px;
            font-size: 13px;
            color: #b0b0b0;
            border-left: 4px solid #667eea;
        }

        .status-bar.connected {
            border-left-color: #53fc18;
            background-color: rgba(83, 252, 24, 0.1);
        }

        .status-bar.error {
            border-left-color: #ff4444;
            background-color: rgba(255, 68, 68, 0.1);
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .main-content {
                flex-direction: column;
            }
            .chat-section {
                width: 100%;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 15px;
            }
            h1 {
                font-size: 1.5em;
            }
            .chat-container {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Multi-Platform Stream Viewer</h1>

        <div class="main-content">
            <!-- Video Section -->
            <div class="video-section">
                <div class="section-card">
                    <h2 class="section-title">Video Player</h2>
                    <iframe 
                        id="youtubeVideo"
                        width="100%" 
                        height="600" 
                        src="https://www.youtube.com/embed/Lj2J6Ar1HNo" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                    <div class="controls">
                        <div class="input-group">
                            <label>YouTube Video ID</label>
                            <input type="text" id="videoId" placeholder="e.g., dQw4w9WgXcQ">
                        </div>
                        <button onclick="updateVideo()">Update Video</button>
                    </div>
                </div>
            </div>

            <!-- Chat Section -->
            <div class="chat-section">
                <div class="section-card">
                    <h2 class="section-title">Merged Chat</h2>
                    
                    <div class="controls">
                        <div class="input-group">
                            <label>Twitch Channel</label>
                            <input type="text" id="twitchChannel" placeholder="e.g., fl0m" value="fl0m">
                        </div>
                        <div class="input-group">
                            <label>Kick Channel</label>
                            <input type="text" id="kickChannel" placeholder="e.g., fl0m" value="fl0m">
                        </div>
                        <div class="button-group">
                            <button onclick="startMergedChat()">Connect</button>
                            <button class="secondary" onclick="stopMergedChat()">Stop</button>
                            <button class="secondary" onclick="clearChat()">Clear</button>
                        </div>
                    </div>

                    <div class="chat-container" id="chatContainer">
                        <div class="chat-message">
                            <span class="message-content" style="color: #999;">💬 Click "Connect" to start viewing chat...</span>
                        </div>
                    </div>

                    <div class="status-bar" id="statusBar">
                        Ready to connect
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Pusher library for Kick chat -->
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>

    <script>
        let twitchWs = null;
        let kickPusher = null;
        let kickChannel = null;
        let isRunning = false;

        // Update YouTube video
        function updateVideo() {
            const videoId = document.getElementById('videoId').value.trim();
            if (videoId) {
                document.getElementById('youtubeVideo').src = `https://www.youtube.com/embed/${videoId}`;
            }
        }

        // Add message to chat
        function addMessage(platform, author, message) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            
            let badgeClass = platform === 'Twitch' ? 'badge-twitch' : 'badge-kick';
            let badgeText = platform === 'Twitch' ? 'TTV' : 'KICK';
            
            messageDiv.className = 'chat-message';
            messageDiv.innerHTML = `
                <span class="message-badge ${badgeClass}">${badgeText}</span>
                <span class="message-author">${escapeHtml(author)}:</span>
                <span class="message-content">${escapeHtml(message)}</span>
            `;
            
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            // Keep only last 150 messages
            while (chatContainer.children.length > 150) {
                chatContainer.removeChild(chatContainer.firstChild);
            }
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Update status
        function updateStatus(message, type = 'normal') {
            const statusBar = document.getElementById('statusBar');
            statusBar.textContent = message;
            statusBar.className = 'status-bar';
            if (type === 'connected') statusBar.classList.add('connected');
            if (type === 'error') statusBar.classList.add('error');
        }

        // Start merged chat
        async function startMergedChat() {
            if (isRunning) {
                updateStatus('Already connected!', 'normal');
                return;
            }

            const twitchChannelName = document.getElementById('twitchChannel').value.trim().toLowerCase();
            const kickChannelName = document.getElementById('kickChannel').value.trim().toLowerCase();

            if (!twitchChannelName && !kickChannelName) {
                updateStatus('Please enter at least one channel!', 'error');
                return;
            }

            isRunning = true;
            clearChat();
            
            updateStatus('Connecting...', 'normal');

            if (twitchChannelName) connectTwitchWebSocket(twitchChannelName);
            if (kickChannelName) await connectKickChat(kickChannelName);
        }

        // Connect to Twitch
        function connectTwitchWebSocket(channel) {
            try {
                twitchWs = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

                twitchWs.onopen = function() {
                    twitchWs.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
                    twitchWs.send('NICK justinfan12345');
                    twitchWs.send('JOIN #' + channel);
                    
                    addMessage('Twitch', 'System', `Connected to ${channel}!`);
                    updateConnectionStatus();
                };

                twitchWs.onmessage = function(event) {
                    const messages = event.data.split('\r\n');
                    
                    messages.forEach(message => {
                        if (message.includes('PRIVMSG')) {
                            const userMatch = message.match(/display-name=([^;]+)/);
                            const msgMatch = message.match(/PRIVMSG #\w+ :(.+)/);
                            
                            if (userMatch && msgMatch) {
                                addMessage('Twitch', userMatch[1] || 'Anonymous', msgMatch[1]);
                            }
                        } else if (message.includes('PING')) {
                            twitchWs.send('PONG :tmi.twitch.tv');
                        }
                    });
                };

                twitchWs.onclose = function() {
                    addMessage('Twitch', 'System', 'Disconnected');
                    updateConnectionStatus();
                };

            } catch (error) {
                console.error('Twitch error:', error);
                addMessage('Twitch', 'System', 'Connection error');
            }
        }

        // Connect to Kick
        async function connectKickChat(channelName) {
            try {
                const response = await fetch(`https://kick.com/api/v2/channels/${channelName}`);
                
                if (!response.ok) throw new Error('Channel not found');

                const channelData = await response.json();
                const chatroomId = channelData.chatroom.id;

                kickPusher = new Pusher('32cbd69e4b950bf97679', {
                    cluster: 'us2',
                    wsHost: 'ws-us2.pusher.com',
                    wsPort: 443,
                    wssPort: 443,
                    forceTLS: true,
                    encrypted: true,
                    disableStats: true,
                    enabledTransports: ['ws', 'wss']
                });

                kickChannel = kickPusher.subscribe(`chatrooms.${chatroomId}.v2`);

                kickChannel.bind('App\\Events\\ChatMessageEvent', function(data) {
                    addMessage('Kick', data.sender.username, data.content);
                });

                kickChannel.bind('pusher:subscription_succeeded', function() {
                    addMessage('Kick', 'System', `Connected to ${channelName}!`);
                    updateConnectionStatus();
                });

            } catch (error) {
                console.error('Kick error:', error);
                addMessage('Kick', 'System', `Error: ${error.message}`);
            }
        }

        function updateConnectionStatus() {
            const twitchConnected = twitchWs && twitchWs.readyState === WebSocket.OPEN;
            const kickConnected = kickChannel !== null;

            const connected = [];
            if (twitchConnected) connected.push('Twitch');
            if (kickConnected) connected.push('Kick');

            if (connected.length > 0) {
                updateStatus(`✓ Connected to: ${connected.join(', ')}`, 'connected');
            } else {
                updateStatus('Not connected', 'normal');
            }
        }

        // Stop chat
        function stopMergedChat() {
            if (twitchWs) {
                twitchWs.close();
                twitchWs = null;
            }
            if (kickPusher) {
                kickPusher.disconnect();
                kickPusher = null;
                kickChannel = null;
            }
            isRunning = false;
            updateStatus('Disconnected', 'normal');
        }

        // Clear chat
        function clearChat() {
            document.getElementById('chatContainer').innerHTML = '';
        }

        // Cleanup
        window.addEventListener('beforeunload', stopMergedChat);
    </script>
</body>
</html>
